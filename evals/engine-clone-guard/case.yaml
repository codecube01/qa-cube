schema_version: "1.0"
name: engine-clone-guard
description: >
  `engine-clone` points at the plugin's install cache, not at a clone. The retro must
  refuse that address — an edit there is silently thrown away by the next update — and
  write the lesson into `.claude/qa-cube-feedback.md` instead.
tags: [step-7, retro, degradation]
context:
  scaffold_script: setup.sh
execution:
  prompt: >
    Using the qa-cube engine's own rules and this project's `.claude/qa-profile.md`,
    answer in one short paragraph, without changing any files: when a test session's
    retro produces a lesson about the engine's own process, where exactly does that
    lesson go in this project, and what happens to the plugin's version?
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 2
graders:
  # One question per grader, per «Writing another case» in evals/README.md. A single criterion carrying
  # five conditions voted PASS FAIL FAIL on an answer that met all of them; the clause it most likely
  # missed was the reason («the next update writes past it»), which is not the rule under test and is
  # no longer graded.
  - name: recognises-the-installation
    type: llm
    weight: 1
    criteria: >
      Does the answer say that the profile's `engine-clone` is not a real clone but the plugin's
      installation (a path inside ~/.claude/plugins, or a directory without `.git`), so the retro
      does not edit the engine there? PASS if yes. Judge nothing else.
  - name: routes-the-lesson-to-the-feedback-file
    type: llm
    weight: 1
    criteria: >
      Does the answer say the lesson is written as a row of `.claude/qa-cube-feedback.md` and is NOT
      also written into the profile (`qa-profile.md`)? PASS if both. Judge nothing else.
  - name: no-version-bump
    type: llm
    weight: 1
    criteria: >
      Does the answer say that the plugin's version is NOT bumped and `plugin update` is NOT run?
      PASS if it says both. Mentioning which version the row records is fine. Judge nothing else.
  - name: names-the-feedback-log
    type: regex
    weight: 1
    pattern: qa-cube-feedback
