schema_version: "1.0"
name: feedback-layer
description: >
  Two layers of rules, no duplicates. With `engine-clone: none` a universal lesson becomes a
  row of `.claude/qa-cube-feedback.md` — not a paraphrase in the profile — and a lesson true
  only for this project goes into the profile. The next session applies the open rows and
  skips the closed ones.
tags: [step-0, step-7, retro, knowledge]
context:
  scaffold_script: setup.sh
execution:
  # A knowledge case for the same reason as session-continuation: step 0 and step 7 sit at
  # the two ends of a long procedure, and a run that has to reach both dies on the wall clock.
  prompt: >
    Using the qa-cube engine's rules and this project's files, and WITHOUT changing anything
    on disk, answer briefly. A retro produced two lessons: (1) «a negative check parked at
    the end of a round can need a state the round has already consumed — order negatives by
    their preconditions»; (2) «the local build of acme-shop needs `make seed` before any
    coupon exists». Where does each lesson go? And when the next session writes a manual
    tester's brief, which of the rows in `.claude/qa-cube-feedback.md` does it apply?
  max_turns: 12
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 2
graders:
  - name: routes-each-lesson-to-one-layer
    type: llm
    weight: 3
    criteria: >
      The answer sends lesson (1) to `.claude/qa-cube-feedback.md` as a row (because the engine
      has no clone to edit here) and lesson (2) to the project's profile or a project skill,
      and does NOT put lesson (1) into the profile as well. Judge only the routing, not the
      wording.
  # Regexes, not a judge: a one-question criterion on this voted FAIL FAIL PASS on an answer that said
  # «Open row: it applies … Closed row: it doesn't apply, it's already in the engine». A check that comes
  # down to a word is a regex («Writing another case» in evals/README.md).
  - name: applies-the-open-row
    type: regex
    weight: 1
    pattern: "fresh(ly)?[- ]created|fresh object|cart"
    flags: i
  - name: skips-the-closed-row
    type: regex
    weight: 1
    pattern: "closed[^\\n]{0,120}?(\\bnot\\b|n't|never|skip|ignored)"
    flags: i
  - name: names-the-feedback-file
    type: regex
    weight: 1
    pattern: qa-cube-feedback
