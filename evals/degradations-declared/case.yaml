schema_version: "1.0"
name: degradations-declared
description: >
  A profile where almost every capability is `none`: the manager must apply the
  degradation table — no autotest step, no test cases, free-form input and a question
  about the session's mode — instead of promising work the project cannot support.
tags: [step-0, degradation]
context:
  scaffold_script: setup.sh
execution:
  prompt: /qa the password reset email never arrives for addresses that contain a plus sign
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write]
runs: 2
graders:
  # The fixture has no application on purpose, so the session stops at the start to ask how to
  # reach the environment. One criterion carrying every condition at once scored near-identical
  # answers anywhere from FAIL×3 to PASS×3 — the cheap judge loses a six-clause question. Split
  # into one question per grader, per «Writing another case» in evals/README.md.
  - name: promises-nothing-ruled-out
    type: llm
    weight: 2
    criteria: >
      Does the answer promise to write an autotest, to create a test case, or to post a comment
      to a tracker? PASS if it promises none of the three. Saying they are unavailable or will
      not be done is not a promise. A report, a session file or a plan is none of the three.
      Judge nothing else: stopping to ask how to reach the environment is expected here.
  # A regex, not a judge: the haiku judge failed «the mode defaults to full cycle» 3/3 on every
  # run, across three wordings of the criterion. Naming the mode is a vocabulary check anyway —
  # the engine's word for it is «full cycle», and asking for the mode says «mode».
  - name: settles-the-mode
    type: regex
    weight: 1
    pattern: "full[- ]cycle|which mode"
    flags: i
